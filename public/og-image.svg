<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fde68a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#451a03;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative sun rays -->
  <g opacity="0.3">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="100" cy="100" r="20" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>
  
  <!-- Sun emoji -->
  <text x="100" y="120" font-size="80" text-anchor="middle">☀️</text>
  
  <!-- Main title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="url(#text)">
    Hi, I'm Sunny
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="#92400e">
    People-Centered Strategist
  </text>
  
  <!-- Description -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#451a03">
    Transforming insights into systems that keep people at the center
  </text>
  
  <!-- Portfolio indicator -->
  <rect x="450" y="400" width="300" height="60" rx="30" fill="#f59e0b" opacity="0.2"/>
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#92400e">
    Portfolio Website
  </text>
</svg>
